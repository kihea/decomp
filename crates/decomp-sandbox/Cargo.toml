[package]
name = "decomp-sandbox"
version = "0.1.0"
edition.workspace = true
description = "Runs DeComp job modules: deterministic, metered WebAssembly."

[features]
default = ["wasmtime"]
wasmtime = ["dep:wasmtime"]
wasmi = ["dep:wasmi"]

[dependencies]
decomp-core = { version = "0.1.0", path = "../decomp-core", default-features = false }
decomp-schema = { version = "0.1.0", path = "../decomp-schema" }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
wasm-encoder = { version = "0.258.3", features = ["wasmparser"] }
wasmparser = "0.258.3"
wasmtime = { version = "49.0.5", default-features = false, features = ["cranelift", "runtime"], optional = true }
# An interpreter, for hosts that cannot compile code at run time, such as a
# canister. A job's metering is added to the module itself, so both engines
# count the same instructions. Its deterministic mode gives NaN results the
# canonical bit pattern, as the compiler is configured to.
wasmi = { version = "2.0.2", default-features = false, features = ["std", "validate", "deterministic"], optional = true }
