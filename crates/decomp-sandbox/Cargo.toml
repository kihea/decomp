[package]
name = "decomp-sandbox"
version = "0.1.0"
edition.workspace = true
description = "Runs DeComp job modules: deterministic, metered WebAssembly."

[dependencies]
decomp-core = { version = "0.1.0", path = "../decomp-core" }
decomp-schema = { version = "0.1.0", path = "../decomp-schema" }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
wasm-encoder = { version = "0.258.3", features = ["wasmparser"] }
wasmparser = "0.258.3"
wasmtime = { version = "49.0.5", default-features = false, features = ["cranelift", "runtime"] }
