[package]
name = "decomp-devnet"
version = "0.1.0"
edition.workspace = true
description = "A local DeComp network: the control plane's services (accounts, registry, job board, receipts) in one process, standing in for the canisters during development and testing."

[dependencies]
axum = "0.8.9"
decomp-control = { version = "0.1.0", path = "../decomp-control" }
decomp-core = { version = "0.1.0", path = "../decomp-core" }
# For reading the public randomness beacon, as a node does to check a draw.
decomp-node = { version = "0.1.0", path = "../decomp-node" }
decomp-sandbox = { version = "0.1.0", path = "../decomp-sandbox" }
rand = "0.10.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
