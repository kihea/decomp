[package]
name = "decomp-node"
version = "0.1.0"
edition.workspace = true
description = "The DeComp node agent: runs jobs on this device, and holds and relays data."

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
decomp-core = { version = "0.1.0", path = "../decomp-core" }
decomp-sandbox = { version = "0.1.0", path = "../decomp-sandbox" }
decomp-schema = { version = "0.1.0", path = "../decomp-schema" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny_http = "0.12.0"
ureq = { version = "3.5.2", features = ["json"] }
