[package]
name = "decomp-core"
version = "0.1.0"
edition.workspace = true
description = "DeComp protocol rules: keys, signed envelopes, and account state. No I/O."

[dependencies]
base64 = "0.23.1"
decomp-schema = { version = "0.1.0", path = "../decomp-schema" }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
