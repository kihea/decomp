[package]
name = "decomp-core"
version = "0.1.0"
edition.workspace = true
description = "DeComp protocol rules: keys, signed envelopes, and account state. No I/O."

[features]
default = ["encrypted"]
# Encrypting a private job's values for the encrypted compute route. Devices
# and nodes need it; the control plane's canisters do not, and leave it out.
encrypted = ["dep:tfhe", "dep:bincode"]

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
# The byte form the homomorphic encryption library's values travel in. The
# library pins this version itself.
bincode = { version = "=1.3.3", optional = true }
decomp-schema = { version = "0.1.0", path = "../decomp-schema" }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hex = "0.4.3"
# The signature checks of two kinds of account controller (see
# `src/controller.rs`): a passkey signs with ECDSA on P-256, and a wallet with
# ECDSA on secp256k1 over a Keccak-256 hash.
k256 = "0.14.0"
p256 = "0.14.0"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
# The homomorphic encryption library a device encrypts a private job's values
# with (see `src/encrypted.rs`). Job modules compute on those values with the
# same version of it, so a module's copy must change together with this one.
tfhe = { version = "=1.8.2", features = ["boolean"], optional = true }
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
