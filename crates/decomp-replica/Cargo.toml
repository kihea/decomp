[package]
name = "decomp-replica"
version = "0.1.0"
edition.workspace = true
description = "Runs the control-plane canisters on a local Internet Computer replica (PocketIC) and serves them through an HTTP gateway, for development and testing."

[dependencies]
candid = "0.10.41"
decomp-core = { version = "0.1.0", path = "../decomp-core" }
decomp-node = { version = "0.1.0", path = "../decomp-node" }
icrc-ledger-types = "0.2.0"
# The client must match the PocketIC server it drives; dfx 0.32 ships server 13.
pocket-ic = "=13.0.0"
serde = { version = "1.0.229", features = ["derive"] }
ureq = { version = "3.5.2", features = ["json"] }
