[package]
name = "decomp-control-canister"
version = "0.1.0"
edition.workspace = true
description = "The DeComp control plane on the Internet Computer: accounts, names, and records, served over the HTTP gateway with the same signed calls as the devnet."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10.41"
decomp-core = { version = "0.1.0", path = "../../crates/decomp-core", default-features = false }
getrandom = "0.4.3"
ic-cdk = "0.20.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.154"
